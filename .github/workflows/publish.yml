name: DivyaCon Connectors Publish

on:
  schedule:
    # Daily at 12:00 PM IST = 06:30 AM UTC
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of connectors to publish per run'
        required: false
        default: '25'
      deprecate_extras:
        description: 'Deprecate extra npm packages not in this repo (true/false)'
        required: false
        default: 'false'
  push:
    branches: [ main ]

# Needed so the check-and-bump job can commit version changes back to main.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Check Activepieces for updated versions -> bump local package.json
  # ─────────────────────────────────────────────────────────────────────────────
  check-and-bump:
    name: Check Activepieces Versions & Bump
    runs-on: ubuntu-latest
    # No need to re-check on push (push already means something changed).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      has_bumps: ${{ steps.check.outputs.has_bumps }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Activepieces versions and bump if needed
        id: check
        run: |
          node scripts/check-activepieces-versions.mjs

          # Read result
          BUMPED=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('.version-check-result.json','utf8'));
            console.log(r.bumped.length);
          ")
          ERRORS=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('.version-check-result.json','utf8'));
            console.log((r.fetchErrors || []).length);
          ")

          echo "Bumped count: $BUMPED"
          echo "Fetch errors: $ERRORS"
          echo "has_bumps=$([ "$BUMPED" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Commit bumped versions back to repo
        if: steps.check.outputs.has_bumps == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore: bump @divyacon versions to match latest Activepieces"
            git push
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Publish updated/new connectors to npm
  # ─────────────────────────────────────────────────────────────────────────────
  # KEY FIX: this job always runs. Previously it only ran when job 1 said
  # "has_bumps=true", so a missed detection silently skipped publishing.
  # ci-publish.mjs already checks npm and publishes only versions that differ,
  # so running it unconditionally is safe.
  publish:
    name: Publish Connectors to npm
    runs-on: ubuntu-latest
    needs: [check-and-bump]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Pull latest (may include the version bump commit from job 1).
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          scope: '@divyacon'

      - name: Re-check versions in publish job
        # Protects against a stale checkout: if job 1's bump commit has not
        # propagated yet, this re-detects the new versions locally.
        continue-on-error: true
        run: node scripts/check-activepieces-versions.mjs

      - name: Vendor real Activepieces source (features + fixes)
        # Replaces each piece's code with the actual upstream npm bundle for
        # the matching version — not just a version-number bump.
        run: node scripts/vendor-ap.mjs

      - name: Publish DivyaCon Connectors
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}
        run: |
          node scripts/ci-publish.mjs

      - name: Upload publish report to ci-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f publish-report.json ]; then
            echo '{"error":"no report generated"}' > publish-report.json
          fi
          B64=$(base64 -w0 publish-report.json)
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/git/ref/heads/main" | jq -r '.object.sha')
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/git/refs" -d "{\"ref\":\"refs/heads/ci-reports\",\"sha\":\"$SHA\"}" > /dev/null 2>&1 || true
          EXISTING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/contents/publish-report.json?ref=ci-reports" | jq -r '.sha // empty')
          if [ -n "$EXISTING" ]; then
            PAYLOAD=$(jq -n --arg m "ci report $GITHUB_RUN_ID" --arg c "$B64" --arg s "$EXISTING" \
              '{message:$m,content:$c,branch:"ci-reports",sha:$s}')
          else
            PAYLOAD=$(jq -n --arg m "ci report $GITHUB_RUN_ID" --arg c "$B64" \
              '{message:$m,content:$c,branch:"ci-reports"}')
          fi
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/contents/publish-report.json" -d "$PAYLOAD" > /dev/null

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deprecate extra npm packages (manual trigger only)
  # ─────────────────────────────────────────────────────────────────────────────
  deprecate-extras:
    name: Deprecate Extra npm Packages
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deprecate_extras == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          scope: '@divyacon'

      - name: Deprecate extra packages not in this repo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/deprecate-extra-packages.mjs
