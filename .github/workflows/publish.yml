name: DivyaCon Connectors Publish

on:
  schedule:
    # Runs daily at 12:30 PM IST (07:00 AM UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of new connectors to publish in this run'
        required: false
        default: '25'
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          scope: '@divyacon'

      - name: Publish DivyaCon Connectors
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}
        run: |
          node scripts/ci-publish.mjs
